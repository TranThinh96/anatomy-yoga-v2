<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Giải phẫu yoga 3D cho giáo viên: xương, cơ, khớp và asana chuyển động với cơ được tô sáng." />
    <title>Yoga Anatomy 3D</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='12' r='7' fill='%2339c6b5'/%3E%3Cpath d='M32 22v18M32 40l-12 16M32 40l12 16M14 26l18 6 18-6' stroke='%23ff5a3c' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="toggle-left" aria-label="Danh sách">☰</button>
        <div class="brand">
          <span class="brand-mark">◉</span>
          <div>
            <div class="brand-title">Yoga Anatomy 3D</div>
            <div class="brand-sub">Giải phẫu cho giáo viên yoga</div>
          </div>
        </div>
        <nav class="mode-tabs" role="tablist">
          <button class="mode-tab active" data-mode="anatomy" role="tab">Giải phẫu</button>
          <button class="mode-tab" data-mode="asana" role="tab">Asana 3D</button>
        </nav>
        <div class="topbar-actions">
          <button class="ghost-btn" id="present-btn" title="Ẩn bảng để trình chiếu cho lớp (phím P)">⛶ Trình chiếu</button>
          <button class="icon-btn only-mobile" id="toggle-right" aria-label="Thông tin">ⓘ</button>
        </div>
      </header>

      <aside class="panel left" id="left-panel">
        <!-- Anatomy mode sidebar -->
        <section class="mode-section" data-for="anatomy">
          <div class="panel-block">
            <div class="block-title">Lớp hiển thị</div>
            <div class="layer-toggles">
              <label class="chip-toggle bone"><input type="checkbox" data-layer="bones" checked /><span>Xương</span></label>
              <label class="chip-toggle muscle"><input type="checkbox" data-layer="muscles" checked /><span>Cơ</span></label>
              <label class="chip-toggle joint"><input type="checkbox" data-layer="joints" checked /><span>Khớp</span></label>
            </div>
            <label class="slider-row">
              <span>Độ trong suốt cơ</span>
              <input type="range" id="muscle-opacity" min="0.1" max="1" step="0.05" value="1" />
            </label>
            <label class="check-row" title="Xương chậu, xương cùng, xương đùi, xương bánh chè từ BodyParts3D (© DBCLS, CC BY-SA 2.1 JP)">
              <input type="checkbox" id="real-bones" checked disabled />
              <span>Xương thật vùng chậu – đùi <small>(BodyParts3D)</small></span>
            </label>
          </div>
          <div class="panel-block grow">
            <div class="seg-tabs" id="anat-tabs">
              <button class="seg active" data-list="muscles">Cơ</button>
              <button class="seg" data-list="bones">Xương</button>
              <button class="seg" data-list="joints">Khớp</button>
            </div>
            <input class="search" id="anat-search" type="search" placeholder="Tìm kiếm… (vd: gân kheo, háng)" />
            <div class="list" id="anat-list"></div>
          </div>
        </section>

        <!-- Asana mode sidebar -->
        <section class="mode-section" data-for="asana" hidden>
          <div class="panel-block">
            <div class="chips" id="asana-cats"></div>
            <input class="search" id="asana-search" type="search" placeholder="Tìm asana… (Sanskrit / tiếng Việt)" />
          </div>
          <div class="panel-block grow">
            <div class="list" id="asana-list"></div>
          </div>
        </section>
      </aside>

      <main class="stage">
        <div id="viewport"></div>
        <div class="tooltip" id="tooltip" hidden></div>

        <div class="view-buttons">
          <button data-view="front" title="Nhìn trước">Trước</button>
          <button data-view="back" title="Nhìn sau">Sau</button>
          <button data-view="left" title="Nhìn từ bên trái người mẫu">Trái</button>
          <button data-view="right" title="Nhìn từ bên phải người mẫu">Phải</button>
          <button data-view="top" title="Nhìn từ trên">Trên</button>
          <button data-view="reset" title="Đặt lại góc nhìn">⟲</button>
        </div>

        <div class="legend" id="legend" hidden>
          <div class="legend-title">Tô màu cơ</div>
          <div class="seg-tabs small" id="color-mode">
            <button class="seg active" data-cm="roles">Theo vai trò</button>
            <button class="seg" data-cm="length">Theo độ dài</button>
            <button class="seg" data-cm="load">Theo tải</button>
          </div>
          <div class="legend-items" data-cm="roles">
            <label><input type="checkbox" data-role="contract" checked /><i class="sw contract"></i>Co cơ (chủ động)</label>
            <label><input type="checkbox" data-role="stretch" checked /><i class="sw stretch"></i>Kéo giãn</label>
            <label><input type="checkbox" data-role="stabilize" checked /><i class="sw stabilize"></i>Ổn định</label>
          </div>
          <div class="legend-items" data-cm="length" hidden>
            <div class="gradient-bar"></div>
            <div class="gradient-labels"><span>Ngắn lại</span><span>Như Tadasana</span><span>Dài ra</span></div>
            <p class="hint">Màu tính trực tiếp từ độ dài cơ so với tư thế đứng Tadasana.</p>
          </div>
          <div class="legend-items" data-cm="load" hidden>
            <div class="gradient-bar load"></div>
            <div class="gradient-labels"><span>Không tải</span><span>Tải lớn</span></div>
            <p class="hint">Nhóm cơ phải chống lại trọng lực, tính từ cân bằng mô-men tại từng khớp.</p>
          </div>
          <div class="legend-phys">
            <div class="legend-sub">Cơ sinh học</div>
            <label><input type="checkbox" data-phys="com" checked /><i class="dot com"></i>Trọng tâm &amp; chân đế</label>
            <label><input type="checkbox" data-phys="grf" checked /><i class="dot grf"></i>Lực đỡ từ sàn</label>
            <label><input type="checkbox" data-phys="loads" checked /><i class="dot load"></i>Tải khớp</label>
          </div>
          <label class="legend-opt"><input type="checkbox" id="show-bones-asana" checked /> Hiện xương</label>
        </div>

        <div class="phys-hud" id="phys-hud" hidden></div>

        <div class="player" id="player" hidden>
          <button class="play-btn" id="play-btn" aria-label="Phát / Dừng">❚❚</button>
          <div class="timeline-wrap">
            <div class="step-label" id="step-label">—</div>
            <div class="timeline" id="timeline">
              <div class="timeline-fill" id="timeline-fill"></div>
              <div class="timeline-marks" id="timeline-marks"></div>
              <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Tua" />
            </div>
          </div>
          <div class="player-actions">
            <button class="ghost-btn small" id="hold-btn" title="Dừng ở tư thế hoàn chỉnh">Giữ tư thế</button>
            <select id="speed" aria-label="Tốc độ">
              <option value="0.5">0.5×</option>
              <option value="0.75">0.75×</option>
              <option value="1" selected>1×</option>
              <option value="1.5">1.5×</option>
            </select>
          </div>
        </div>
      </main>

      <aside class="panel right" id="right-panel">
        <div id="info"></div>
      </aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
